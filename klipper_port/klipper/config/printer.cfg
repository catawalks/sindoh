# =====================================================================
# Sindoh DP200 - YOUR printer.cfg
# =====================================================================
# The hardware definition and the macros come from the two included files,
# which updates replace. This file is yours and is never overwritten:
# - put your own changes and overrides here (a section repeated here adds
#   to / overrides the included one);
# - the per-printer values below are written by calibration commands, then
#   SAVE_CONFIG (which only works for options that are NOT in an include).
# =====================================================================

[include dp200_printer.cfg]
[include dp200_macros.cfg]

# --- per-printer calibration -----------------------------------------
[stepper_z]
# Z switch height above the bed: paper test (LV_PROBE_CALIBRATE) or
# Z_ENDSTOP_CALIBRATE. First unit (2026-10-19): 2.275.
position_endstop: 2.275

[probe]
# Pin position relative to the nozzle (measure with a ruler): the pin sits
# front-right of the nozzle on the DP200 (front = lower Y).
x_offset: 23.5   # measured 2026-10-27 on the test printer (printed pad + probe scan)
y_offset: -28.0
# Pin tip below the nozzle: LV_PROBE_CALIBRATE -> paper test -> ACCEPT ->
# LV_PROBE_CALIBRATE_SAVE Z=<accepted> -> SAVE_CONFIG. First unit: 2.530.
z_offset: 2.530

# Probe reads a false left-to-right slope (the pin is 23.5 mm beside the
# nozzle and the carriage tilts a little along the X rail)? Symptom: with a
# mesh the first layer is too high on one side and squashed on the other.
# Compare the probe with a nozzle paper test at three spots along X (mesh
# off), then enter mean(probe - nozzle) minus each spot's (probe - nozzle).
# Klipper's AXIS_TWIST_COMPENSATION_CALIBRATE does not work with this pin
# (it would lower the nozzle with the pin out). First unit, 2026-11-14:
#[axis_twist_compensation]
#calibrate_start_x: 25
#calibrate_end_x: 175
#calibrate_y: 30
#compensation_start_x: 25
#compensation_end_x: 175
#z_compensations: -0.061, -0.042, 0.103

[extruder]
# Gains measured on the development DP200 (2026-10-21, 210 C, max_power 0.6).
# Run PID_CALIBRATE HEATER=extruder TARGET=210, then SAVE_CONFIG, for your own printer.
control: pid
pid_Kp: 20.223
pid_Ki: 1.143
pid_Kd: 89.487

[heater_bed]
# Gains measured on the development DP200 (2026-10-21, 60 C, max_power 1.0).
# Run PID_CALIBRATE HEATER=heater_bed TARGET=60, then SAVE_CONFIG, for your own printer.
control: pid
pid_Kp: 74.532
pid_Ki: 1.252
pid_Kd: 1109.592
