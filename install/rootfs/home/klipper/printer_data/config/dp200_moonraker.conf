# Moonraker update settings for the Sindoh DP200 port (port-owned: the USB
# installer replaces this file on an upgrade; moonraker.conf includes it).
#
# Only Mainsail is updated by Moonraker: its official release zips from
# GitHub, which need neither git nor a compiler on the printer. Klipper (our
# DP200 fork, prebuilt C helper) and Moonraker come as tested bundles from
# the port's releases instead. On the NAND install they have no .git, so
# Moonraker treats them as "not updatable" (type none) and never replaces
# them. The touch screen's SYSTEM -> UPDATE page uses the same updater.

[update_manager]
# no apt on the printer (and the stock side's packages are not Debian's)
enable_system_updates: False
# look for a new Mainsail once a day (between 0 and 5 h, Moonraker's window)
enable_auto_refresh: True
refresh_interval: 24

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: ~/mainsail
