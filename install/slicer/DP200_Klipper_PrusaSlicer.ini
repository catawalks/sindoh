# PrusaSlicer config bundle: Sindoh DP200 running Klipper (klipper_port)
# File > Import > Import Config Bundle (PrusaSlicer and SuperSlicer).
# OrcaSlicer and Cura: see README.md in this folder.
# Bed: 210 x 201 mm printable from Klipper (0,0), with the plate's two back
# corner cut-outs (old levelling touch points) left out: 4 x 8 mm each.
# First-draft values: retraction still needs tuning (pressure advance 0.30 is
# set in dp200_printer.cfg).

[print:DP200 0.20mm Klipper]
layer_height = 0.2
first_layer_height = 0.25
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
perimeter_speed = 40
external_perimeter_speed = 25
small_perimeter_speed = 20
infill_speed = 50
solid_infill_speed = 40
top_solid_infill_speed = 25
first_layer_speed = 20
travel_speed = 120
travel_speed_z = 5
bridge_speed = 25
gap_fill_speed = 20
support_material_speed = 40
default_acceleration = 1500
first_layer_acceleration = 800
skirts = 0
brim_width = 0
gcode_label_objects = firmware
gcode_comments = 0
complete_objects = 0
avoid_crossing_perimeters = 0
compatible_printers_condition = printer_notes=~/.*DP200_KLIPPER.*/

[filament:DP200 PLA]
filament_type = PLA
filament_diameter = 1.75
extrusion_multiplier = 1
first_layer_temperature = 210
temperature = 205
first_layer_bed_temperature = 60
bed_temperature = 60
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 2
bridge_fan_speed = 100
cooling = 1
filament_max_volumetric_speed = 8
start_filament_gcode = "; Filament gcode\n"
compatible_printers_condition = printer_notes=~/.*DP200_KLIPPER.*/

[printer:Sindoh DP200 Klipper]
printer_technology = FFF
printer_notes = DP200_KLIPPER
bed_shape = 0x0,210x0,210x193,206x193,206x201,4x201,4x193,0x193
max_print_height = 190
nozzle_diameter = 0.4
gcode_flavor = klipper
use_relative_e_distances = 1
use_firmware_retraction = 0
autoemit_temperature_commands = 0
retract_length = 4
retract_speed = 35
deretract_speed = 35
retract_lift = 0.2
retract_lift_above = 0
retract_lift_below = 0
retract_lift_top = "All surfaces"
retract_before_travel = 2
retract_layer_change = 1
wipe = 0
machine_limits_usage = time_estimate_only
machine_max_feedrate_x = 150
machine_max_feedrate_y = 150
machine_max_feedrate_z = 5
machine_max_feedrate_e = 40
machine_max_acceleration_x = 1500
machine_max_acceleration_y = 1500
machine_max_acceleration_z = 100
machine_max_acceleration_extruding = 1500
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 1500
start_gcode = PRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature]\nPRIME_LINE\nG90\nM83\n
end_gcode = PRINT_END\n
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n
layer_gcode = ;AFTER_LAYER_CHANGE\n
thumbnails = 32x32/PNG, 300x300/PNG

[presets]
print = DP200 0.20mm Klipper
filament = DP200 PLA
printer = Sindoh DP200 Klipper
